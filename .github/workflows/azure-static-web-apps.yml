# Pipeline CI/CD del laboratorio serverless.
# Autenticación: TOKEN DE DESPLIEGUE de Static Web Apps (no requiere Service Principal).
#   Repositorio → Settings → Secrets and variables → Actions → New repository secret
#   Nombre: AZURE_STATIC_WEB_APPS_API_TOKEN
name: CI/CD Serverless Lab

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # para que la acción comente la URL de preview en el PR

jobs:
  test:
    name: Pruebas de la API
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test

  build_and_deploy_job:
    name: Desplegar a Static Web Apps
    needs: test
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build y deploy (sitio + funciones)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src       # sitio estático
          api_location: api       # Azure Functions administradas
          output_location: ""     # no hay paso de build para el frontend

  close_pull_request_job:
    name: Cerrar entorno de preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: src
